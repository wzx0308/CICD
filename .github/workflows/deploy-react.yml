name: Deploy React

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./react
        run: npm install

      - name: Create .env.production
        working-directory: ./react
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env.production << EOF
          VITE_API_BASE_URL=$VITE_API_BASE_URL
          EOF

      - name: Build
        working-directory: ./react
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload to server
        run: |
          tar -czf /tmp/react-dist.tar.gz -C react/dist .
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no /tmp/react-dist.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/react-dist.tar.gz

      - name: Deploy React
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            
            echo "Creating directories..."
            mkdir -p /var/www/react
            
            echo "Extracting files..."
            tar -xzf /tmp/react-dist.tar.gz -C /var/www/react
            rm -f /tmp/react-dist.tar.gz
            
            echo "Listing files..."
            ls -la /var/www/react/
            
            echo "Setting permissions..."
            chown -R www-data:www-data /var/www/react || true
          ENDSSH

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "ls -la /var/www/react/ && echo 'Deployment successful'"