name: Deploy React

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./react
        run: npm install

      - name: Create .env.production
        working-directory: ./react
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env.production << EOF
          VITE_API_BASE_URL=$VITE_API_BASE_URL
          EOF

      - name: Build
        working-directory: ./react
        run: npm run build

      - name: Upload to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          echo "=== Installing SSH tools ==="
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

          echo "=== Packaging build ==="
          tar -czf /tmp/react-dist.tar.gz -C react/dist .

          echo "=== Uploading to server ==="
          sshpass -v -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no /tmp/react-dist.tar.gz $SERVER_USER@$SERVER_IP:/tmp/react-dist.tar.gz

      - name: Deploy React
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'ENDSSH'
            set -e
            
            echo "Creating directories..."
            mkdir -p /var/www/react
            
            echo "Extracting files..."
            tar -xzf /tmp/react-dist.tar.gz -C /var/www/react
            rm -f /tmp/react-dist.tar.gz
            
            echo "Listing files..."
            ls -la /var/www/react/
            
            echo "Setting permissions..."
            chown -R www-data:www-data /var/www/react
          ENDSSH

      - name: Verify
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "=== Final verification ==="
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "ls -la /var/www/react/ && echo 'Deployment successful'"