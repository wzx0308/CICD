name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./api4
        run: npm install

      - name: Create .env file
        working-directory: ./api4
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.API_PORT }}
        run: |
          cat > .env << EOF
          DB_HOST=$DB_HOST
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          JWT_SECRET=$JWT_SECRET
          PORT=$PORT
          NODE_ENV=production
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH connection successful' && uname -a"

      - name: Package and upload
        run: |
          tar -czf /tmp/api4.tar.gz -C api4 .
          ls -la /tmp/api4.tar.gz

      - name: Upload files to server
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no /tmp/api4.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/api4.tar.gz

      - name: Setup and start API
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            
            echo "Creating directories..."
            mkdir -p /var/www/api4
            mkdir -p /var/www/api4/logs
            mkdir -p /var/www/api4/upload
            
            echo "Extracting files..."
            cd /var/www/api4
            tar -xzf /tmp/api4.tar.gz
            rm -f /tmp/api4.tar.gz
            
            echo "Listing files..."
            ls -la
            
            echo "Installing dependencies..."
            npm install --production
            
            echo "Installing PM2 globally..."
            npm install -g pm2
            
            echo "Stopping existing process..."
            pm2 delete api4 2>/dev/null || true
            
            echo "Starting API..."
            pm2 start ecosystem.config.js --name api4
            
            sleep 3
            
            echo "PM2 status:"
            pm2 list
            
            echo "API health check:"
            curl -v http://localhost:3000/ 2>&1 || echo "API not responding"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "pm2 list && curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/"