name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./api4
        run: npm install

      - name: Create .env file
        working-directory: ./api4
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.API_PORT }}
        run: |
          cat > .env << EOF
          DB_HOST=$DB_HOST
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          JWT_SECRET=$JWT_SECRET
          PORT=$PORT
          NODE_ENV=production
          EOF
          cat .env

      - name: Package and upload
        run: |
          tar -czf /tmp/api4.tar.gz -C api4 .
          ls -la /tmp/api4.tar.gz

      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          echo "=== Installing SSH tools ==="
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

          echo "=== Testing SSH connection ==="
          echo "Server: $SERVER_IP"
          echo "User: $SERVER_USER"
          
          sshpass -v -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 $SERVER_USER@$SERVER_IP "echo 'SSH connection successful' && uname -a"

      - name: Upload files to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          echo "=== Uploading files ==="
          sshpass -v -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no /tmp/api4.tar.gz $SERVER_USER@$SERVER_IP:/tmp/api4.tar.gz

      - name: Setup and start API
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          echo "=== Setting up on server ==="
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'ENDSSH'
            set -e
            
            echo "Creating directories..."
            mkdir -p /var/www/api4
            mkdir -p /var/www/api4/logs
            mkdir -p /var/www/api4/upload
            
            echo "Extracting files..."
            cd /var/www/api4
            tar -xzf /tmp/api4.tar.gz
            rm -f /tmp/api4.tar.gz
            
            echo "Listing files..."
            ls -la
            
            echo "Installing dependencies..."
            npm install --production 2>&1 || npm install --production 2>&1
            
            echo "Installing PM2 globally..."
            npm install -g pm2
            
            echo "Stopping existing process..."
            pm2 delete api4 2>/dev/null || true
            
            echo "Starting API..."
            pm2 start ecosystem.config.js --name api4 || node bin/www &
            
            sleep 3
            
            echo "PM2 status:"
            pm2 list
            
            echo "API health check:"
            curl -v http://localhost:3000/ 2>&1 || echo "API not responding"
            
          ENDSSH

      - name: Verify deployment
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          echo "=== Final verification ==="
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "pm2 list && curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/"